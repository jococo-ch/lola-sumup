name: SonarQube

on:
  push:
    branches: [ "main" ]
  pull_request:
  workflow_dispatch:

# All permissions denied on workflow level
permissions: {}

env:
  CARGO_TERM_COLOR: always

jobs:
  sonarqube:
    name: SonarQube
    runs-on: ubuntu-latest
    # Pull requests from forks get no OIDC token, so the secretless auth would fail
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository

    permissions:
      contents: read
      id-token: write # lets sonarqube-auth-action request a GitHub OIDC token

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          fetch-depth: 0 # Shallow clones should be disabled for a better relevancy of analysis
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          prefix-key: "v6-rust-sonar"

      # Run right before the scan: the ephemeral token is valid for 30 minutes only
      - uses: SonarSource/sonarqube-auth-action@b372e2c2930aadfcc4f4399446da1e12772709ad # v1.2
        id: auth
      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@59202af334b4ba7b5db01b701b8e79f8b3bef0f4 # v8.5.0
        with:
          args: >
            -Dsonar.organization=${{ steps.auth.outputs.organization }}
            -Dsonar.projectKey=${{ steps.auth.outputs.project-key }}
