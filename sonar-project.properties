# Organization and project key are passed by the workflow (from sonarqube-auth-action)

# Rust unit tests live inline in the source files (#[cfg(test)] modules)
sonar.sources=src

# Test helpers only, not production code
sonar.coverage.exclusions=src/test_fixtures.rs,src/test_utils.rs
sonar.cpd.exclusions=src/test_fixtures.rs,src/test_utils.rs

# Produced by `cargo llvm-cov` in .github/workflows/sonar.yml
sonar.rust.lcov.reportPaths=target/lcov.info

# Clippy is run by the Sonar Rust analyzer itself (sonar.rust.clippy.enabled defaults to true)
